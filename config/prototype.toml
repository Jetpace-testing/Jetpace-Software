# Prototype site configuration.
#
# In production this lives in the database, with the dry-run diff and
# reversible apply that Meril EMS already does well. For stage 2 it is a
# file, because a file is the smallest thing that works and the shape of
# the data is the same either way.
#
# Addresses here are WIRE addresses: the datasheet number minus 40001.
# DP_PV at datasheet 40001 is address 0.

[site]
tenant = "jetpace"
name = "Prototype"
timezone = "Asia/Kolkata"

# One gateway, pointed at the simulator. A real serial-to-TCP converter
# looks identical from here - the devices behind it share one bus, which is
# why one worker thread walks them in turn.
[[gateway]]
label = "sim-01"
host = "127.0.0.1"
port = 5020
timeout_s = 2.0
gap_s = 0.025        # between requests on the same bus
interval_s = 2.0     # one full pass of all devices
# skip a device that did not answer for this many passes. A dead device
# otherwise costs a full timeout on every single pass.
offline_backoff_cycles = 5

  [[gateway.device]]
  code = "DP-001"
  name = "Corridor"
  unit_id = 1
  model = "iDP-100"

  [[gateway.device]]
  code = "DP-002"
  name = "Airlock"
  unit_id = 2
  model = "iDP-100"

  [[gateway.device]]
  code = "DP-003"
  name = "Filling"
  unit_id = 3
  model = "iDP-100"

# What to read from an iDP-100. Signed, because a reversed cascade is
# negative and reading it unsigned reports 65531 Pa instead of an excursion.
[model.iDP-100]
  [[model.iDP-100.point]]
  param = "dp"
  address = 0        # datasheet 40001, DP_PV
  kind = "s16"
  scale = 1.0

  [[model.iDP-100.point]]
  param = "dp_unit"
  address = 13       # datasheet 40014, 0 = mmWC / 1 = Pa
  kind = "u16"
  scale = 1.0
