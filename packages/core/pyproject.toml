[project]
name = "jetpace-core"
version = "0.1.0"
description = "Shared platform: devices, drivers, historian, alarms, identity, updates"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymodbus>=3.6",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    # Form parsing for the commissioning POSTs. FastAPI's Form() refuses
    # to build a route without it, even for the urlencoded bodies HTMX
    # actually sends. Apache-2.0, so it redistributes commercially -
    # architecture.md section 7.
    "python-multipart>=0.0.9",
    "paho-mqtt>=2.1",
    "cryptography>=43",
    "pywin32>=306 ; sys_platform == 'win32'",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetpace_core"]
