[project]
name = "jetpace-energy"
version = "0.1.0"
description = "Energy management: tariffs, billing, demand, EnPI"
requires-python = ">=3.12,<3.13"
# Core only. A product depends on the platform; the platform must never
# depend on a product, and no product may depend on the other - that is
# the whole point of the split (architecture.md §3). Everything else this
# needs - psycopg, fastapi, jinja2 - arrives through core, which is where
# the versions are decided once.
dependencies = ["jetpace-core"]

# Stated here as well as in the workspace root so that reading this file
# alone tells you core comes from the checkout rather than an index.
[tool.uv.sources]
jetpace-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetpace_energy"]
