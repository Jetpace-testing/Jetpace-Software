[project]
name = "jetpace-environment"
version = "0.1.0"
description = "Environmental monitoring: ISO 14644, DP cascade, Part 11"
requires-python = ">=3.12,<3.13"
# Core only - see the note in packages/energy/pyproject.toml.
#
# architecture.md §2 wants this one to pin a VALIDATED core version while
# energy tracks head, so that an energy release cannot reach a qualified
# cleanroom. That cannot be expressed here: one uv workspace resolves to
# exactly one version of core for every member, and `{ workspace = true }`
# always means the checkout. Delivering it needs core published to a
# private index, or this package in its own repository. §2 records that;
# this file cannot do it.
dependencies = ["jetpace-core"]

[tool.uv.sources]
jetpace-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetpace_environment"]
