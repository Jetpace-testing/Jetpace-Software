[project]
name = "jetpace"
version = "0.1.0"
description = "Jetpace platform - energy and environmental monitoring"
requires-python = ">=3.12,<3.13"
# The development root depends on all three so that `uv sync` installs
# everything and the whole suite can run. A customer install is not this
# root: which products are active there is decided at runtime from
# config, because one frozen bundle carries all three packages.
dependencies = [
    "jetpace-core",
    "jetpace-energy",
    "jetpace-environment",
]

[tool.uv.workspace]
# A glob, so a new package under packages/ is a member without an edit here.
members = ["packages/*"]

[tool.uv.sources]
jetpace-core = { workspace = true }
jetpace-energy = { workspace = true }
jetpace-environment = { workspace = true }

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pytest>=8.0",
    # Starlette's TestClient needs it. Test-only: nothing in the
    # application imports httpx, so it is not followed into the frozen
    # bundle. Added for the product-composition tests, where the bugs are
    # at the HTTP layer - a static mount registered in the wrong order
    # serves a 404 and is invisible to any test that only inspects
    # objects. Still needs nothing running: no server, no database.
    "httpx2>=0.28",
]

[tool.pytest.ini_options]
# Listed rather than globbed. `packages/*/tests` would also work, but a
# glob silently matches nothing when a directory is missing or misnamed,
# and the failure mode of this setting is a suite that runs fewer tests
# than it should while still reporting success.
testpaths = [
    "packages/core/tests",
    "packages/energy/tests",
    "packages/environment/tests",
]
pythonpath = [
    "packages/core/src",
    "packages/energy/src",
    "packages/environment/src",
]
